name: Compilar Mod Fabric 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar proyecto y compilar con Gradle
        run: |
          # Busca automáticamente dónde quedó el archivo gradlew
          GRADLE_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: No se encontró el archivo gradlew en el repositorio."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "Compilando mod en la carpeta: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Subir el archivo .JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-1.21.11
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
