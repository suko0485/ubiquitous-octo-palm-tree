name: Compilar Mod Fabric 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle en la nube
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Compilar mod
        run: gradle build

      - name: Subir el archivo .JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
