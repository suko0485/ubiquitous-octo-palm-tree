name: Compilar Mod Fabric 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir archivo ZIP
        run: |
          mkdir -p mod_src
          unzip -q *.zip -d mod_src
          # Si el zip tiene una subcarpeta raíz, mueve su contenido a mod_src
          if [ $(ls -1 mod_src | wc -l) -eq 1 ] && [ -d "mod_src/$(ls -1 mod_src)" ]; then
            SUBDIR=$(ls -1 mod_src)
            mv mod_src/$SUBDIR/* mod_src/ 2>/dev/null || true
            mv mod_src/$SUBDIR/.* mod_src/ 2>/dev/null || true
            rmdir "mod_src/$SUBDIR"
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permisos y compilar con Gradle
        working-directory: ./mod_src
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Subir el archivo .JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-1.21.11
          path: |
            mod_src/build/libs/*.jar
            !mod_src/build/libs/*-sources.jar
